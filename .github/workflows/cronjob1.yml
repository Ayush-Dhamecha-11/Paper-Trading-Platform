name: Daily Price Fetch

on:
  schedule:
    # GitHub Actions cron is UTC only, no timezone support.
    # 17:00 IST = 11:30 UTC. NSE trading days are Mon-Fri.
    - cron: "0 3 * * 1-5"
      timezone: "Asia/Kolkata"
      
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab, for testing

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirement.txt

      - name: Run daily pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY}}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: python -m jobs.cron_job

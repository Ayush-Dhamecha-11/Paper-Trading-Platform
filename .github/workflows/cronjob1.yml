name: Daily Price Fetch

on:
  schedule:
    # GitHub Actions cron is UTC only, no timezone support.
    # 17:00 IST = 11:30 UTC. NSE trading days are Mon-Fri.
    - cron: "30 11 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab, for testing

jobs:
  fetch-prices:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirement.txt

      - name: Run daily pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m jobs.price_fetch_cron
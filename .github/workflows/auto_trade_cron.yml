name: Daily Auto-Trade

on:
  schedule:
    # GitHub Actions cron is UTC only. 09:15 IST (NSE market open) = 03:45 UTC.
    - cron: "45 3 * * 1-5"
  workflow_dispatch: {}

jobs:
  auto-trade:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirement.txt

      - name: Run auto-trade job
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m jobs.auto_trade_cron
